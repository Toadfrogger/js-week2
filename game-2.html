<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .board {
        width: 600px;
        height: 300px;
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqmUPOpwuHEE5iimIHqo7Zt5JrTWI79b5ehWWyrsGN5g&s=10");
        border: 2px solid black;
        position: relative;
      }

      .player,
      .star {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: rgb(230, 226, 114);
        position: absolute;
        text-align: center;
        font-size: 20px;
        line-height: 20px;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; justify-content: space-around">
      <div id="score">0</div>
      <div id="timer"></div>
    </div>

    <div id="board" class="board">
      <div id="player" class="player">🐸</div>
      <div id="star" class="star">🪰</div>
    </div>

    <button onclick="changeDir('up')">Top</button>
    <button onclick="changeDir('down')">Bottom</button>
    <button onclick="changeDir('left')">Left</button>
    <button onclick="changeDir('right')">Right</button>

    <script>
      let highScore = 0;
      let direction = "right";
      let playerX = 0;
      let playerY = 0;

      let timer = 60;
      const timeEl = document.getElementById("timer");

      setInterval(function () {
        timer--;
        timeEl.textContent = timer;
        if (timer == 0) {
          alert(`Your score is ${score}`);
          localStorage.setItem("highscore", `${score}`);
        }
      }, 1000);

      let starX = 0;
      let starY = 0;

      let score = 0;

      const boardHeight = 300;
      const boardWidth = 600;

      const playerEl = document.getElementById("player");
      const boardEl = document.getElementById("board");
      const starEl = document.getElementById("star");

      boardEl.style.width = `${boardWidth}px`;
      boardEl.style.height = `${boardHeight}px`;

      draw();

      function moveUp() {
        playerY = playerY - 10;
        if (playerY < 0) {
          playerY = boardHeight - 10;
        }
        draw();
      }

      function moveDown() {
        playerY = playerY + 10;
        if (playerY > boardHeight - 10) {
          playerY = 0;
        }
        draw();
      }

      function moveRight() {
        playerX = playerX + 10;
        if (playerX > boardWidth - 10) {
          playerX = 0;
        }
        draw();
      }

      function moveLeft() {
        playerX = playerX - 10;
        if (playerX < 0) {
          playerX = boardWidth - 10;
        }
        draw();
      }

      function draw() {
        playerEl.style.top = `${playerY}px`;
        playerEl.style.left = `${playerX}px`;

        starEl.style.top = `${starY}px`;
        starEl.style.left = `${starX}px`;

        if (playerX == starX && playerY == starY) {
          score++;
          document.getElementById("score").textContent = score;
          starX = getRandomInt(30) * 10;
          starY = getRandomInt(15) * 10;
          draw();
        }

        function getRandomInt(max) {
          return Math.floor(Math.random() * max);
        }
      }

      function gameLoop() {
        if (direction == "right") {
          moveRight();
        } else if (direction == "left") {
          moveLeft();
        } else if (direction == "up") {
          moveUp();
        } else if (direction == "down") {
          moveDown();
        }
      }

      function changeDir(newDir) {
        direction = newDir;
      }

      let speed = 200;
      setInterval(gameLoop, speed);

      document.addEventListener("keydown", function (event) {
        if (
          ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(
            event.code,
          )
        ) {
          event.preventDefault();
        }

        if (event.code == "ArrowUp") {
          changeDir("up");
        } else if (event.code == "ArrowDown") {
          changeDir("down");
        } else if (event.code == "ArrowRight") {
          changeDir("right");
        } else if (event.code == "ArrowLeft") {
          changeDir("left");
        }
      });
    </script>
  </body>
</html>
