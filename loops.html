<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="output"></div>
    <script>
      const n = 5;
      let i = 0;
      let result = "* ";
      while (i < n) {
        result = result + "*";
        i++;
      }

      document.getElementById("output").textContent = result;
    </script>
  </body>
